<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="DemavrinTeam logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d03f"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1f35"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#a4161a"/>
    </linearGradient>
    <filter id="emboss" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <path id="textArc" d="M 70,200 A 130,130 0 0,1 330,200"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#1a2a44" stroke-width="2"/>
  <circle cx="200" cy="200" r="175" fill="url(#navyGrad)" filter="url(#emboss)"/>

  <!-- Stars in upper arc -->
  <g fill="url(#goldGrad)">
    <polygon points="55,195 58,204 67,204 60,210 63,219 55,213 47,219 50,210 43,204 52,204" transform="scale(0.7) translate(35,95)"/>
    <polygon points="55,195 58,204 67,204 60,210 63,219 55,213 47,219 50,210 43,204 52,204" transform="scale(0.7) translate(475,95)"/>
  </g>

  <!-- Curved text -->
  <text fill="#ffffff" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" letter-spacing="3">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">DEMAVRINTEAM</textPath>
  </text>

  <!-- Inner field -->
  <circle cx="200" cy="215" r="130" fill="#0d1b2a"/>

  <!-- Star field dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="140" cy="130" r="1.5"/>
    <circle cx="170" cy="115" r="1"/>
    <circle cx="230" cy="120" r="1.5"/>
    <circle cx="260" cy="135" r="1"/>
    <circle cx="155" cy="150" r="1"/>
    <circle cx="245" cy="145" r="1"/>
    <circle cx="200" cy="105" r="1.2"/>
  </g>

  <!-- Red lower band -->
  <path d="M 75,260 Q 200,290 325,260 L 325,310 Q 200,340 75,310 Z" fill="url(#redGrad)"/>

  <!-- Perch bar -->
  <rect x="120" y="268" width="160" height="6" rx="2" fill="url(#goldGrad)"/>

  <!-- Eagle body -->
  <g transform="translate(200,220)">
    <!-- Tail -->
    <path d="M -30,30 L -50,70 L -20,55 L 0,75 L 20,55 L 50,70 L 30,30 Z" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>

    <!-- Wings -->
    <path d="M -25,-10 Q -90,-30 -110,10 Q -80,20 -50,5 Q -70,25 -55,45 Q -30,20 -20,10 Z" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
    <path d="M 25,-10 Q 90,-30 110,10 Q 80,20 50,5 Q 70,25 55,45 Q 30,20 20,10 Z" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>

    <!-- Wing feather lines -->
    <g stroke="#bbb" stroke-width="0.8" fill="none" opacity="0.6">
      <path d="M -60,5 L -95,15"/>
      <path d="M -55,20 L -85,30"/>
      <path d="M -48,35 L -70,48"/>
      <path d="M 60,5 L 95,15"/>
      <path d="M 55,20 L 85,30"/>
      <path d="M 48,35 L 70,48"/>
    </g>

    <!-- Body -->
    <ellipse cx="0" cy="15" rx="22" ry="30" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>

    <!-- Shield on chest -->
    <g transform="translate(0,10)">
      <path d="M 0,-18 L 16,-8 L 16,8 Q 0,22 -16,8 L -16,-8 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <!-- Crescent -->
      <path d="M 4,-2 A 10,10 0 1,0 4,14 A 7,7 0 1,1 4,-2" fill="#ffffff"/>
      <!-- Star -->
      <polygon points="8,4 9.5,8 14,8 10.5,10.5 12,15 8,12.5 4,15 5.5,10.5 2,8 6.5,8" fill="#ffffff" transform="translate(2,-1) scale(0.55)"/>
    </g>

    <!-- Head -->
    <circle cx="-18" cy="-8" r="14" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>
    <!-- Beak -->
    <path d="M -30,-6 L -42,-2 L -30,2 Z" fill="url(#goldGrad)"/>
    <!-- Eye -->
    <circle cx="-22" cy="-10" r="2.5" fill="#1a1a1a"/>
    <circle cx="-21" cy="-11" r="0.8" fill="#fff"/>

    <!-- Talons -->
    <g fill="url(#goldGrad)">
      <path d="M -12,42 L -16,58 L -10,56 L -8,62 L -4,54 Z"/>
      <path d="M 0,44 L -2,60 L 4,58 L 6,64 L 10,56 Z"/>
      <path d="M 12,42 L 8,58 L 14,56 L 16,62 L 20,54 Z"/>
    </g>
  </g>

  <!-- Inner gold ring -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
</svg>
